name: OpenTaiko Android APK

# ビルドスクリプトかこのファイルを変更して push すると自動実行。
# main に取り込んだ後は Actions タブ →「OpenTaiko Android APK」→「Run workflow」でも手動実行できる。
on:
  push:
    paths:
      - "opentaiko-android/**"
      - ".github/workflows/opentaiko-android.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenTaiko のコミット/ブランチ（空欄なら検証済みの固定コミット）"
        required: false
        default: ""
      abis:
        description: "arm64（実機用・小さい） / all（エミュレータ用 x86_64 も含む）"
        required: false
        default: "arm64"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # Releases に APK を置くため
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET Android workload
        run: dotnet workload install android

      - name: Build
        env:
          OPENTAIKO_REF: ${{ inputs.ref }}
          ABIS: ${{ inputs.abis }}
        run: |
          [ -n "$OPENTAIKO_REF" ] || unset OPENTAIKO_REF
          export JAVA_SDK="$JAVA_HOME" ANDROID_SDK="$ANDROID_HOME"
          bash opentaiko-android/build.sh "$RUNNER_TEMP/opentaiko"

      # ログイン不要で直接ダウンロードできるよう Releases に置く。
      # 常に最新版: https://github.com/<owner>/<repo>/releases/latest/download/OpenTaiko-android-arm64.apk
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="$RUNNER_TEMP/opentaiko/out"
          OT_SHA=$(git -C "$RUNNER_TEMP/opentaiko/OpenTaiko" rev-parse --short HEAD)
          TAG="opentaiko-android-r${GITHUB_RUN_NUMBER}"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          OpenTaiko (https://github.com/0auBSQ/OpenTaiko, MIT) の Android ビルドです。研究・個人利用向け。

          - OpenTaiko コミット: ${OT_SHA}
          - 下の Assets から .apk をダウンロードしてインストールしてください（提供元不明のアプリの許可が必要）。
          - 音声ライブラリ BASS (un4seen.com) は非商用利用のみ無料です。動画用に FFmpeg (LGPL) を同梱しています。
          EOF
          gh release create "$TAG" "$OUT"/*.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenTaiko Android (OpenTaiko ${OT_SHA}, build ${GITHUB_RUN_NUMBER})" \
            --notes-file "$RUNNER_TEMP/notes.md" --latest
